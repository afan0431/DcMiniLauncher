# 每天把上游 AtmoOmen/FFXIVQuickLauncher 的 CN 分支合进本仓库的 CN。
#
# - 能干净合并：直接推到 CN（产生一个 merge commit，和手工 `git merge atmoomen/CN` 一样），
#   然后自动发版（release.yml），客户端下次启动自动更新。
# - 有冲突 / 推不上去：不动 CN，开（或更新）一个带 `upstream-sync` 标签的 Issue，
#   列出冲突文件和本地处理命令，等人来解。
#
# ⚠ 推不上去最常见的原因：上游这次改了 .github/workflows/ 下的文件，
#   而 GITHUB_TOKEN 没有写 workflow 文件的权限。这种情况也走 Issue，本地合并后推即可。
name: Sync upstream

on:
  schedule:
    - cron: "17 20 * * *" # 北京时间每天 04:17
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/AtmoOmen/FFXIVQuickLauncher.git
  UPSTREAM_BRANCH: CN
  TARGET_BRANCH: CN
  ISSUE_LABEL: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Merge
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "已包含上游 ${UPSTREAM_SHA::8}，无需同步"
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          behind=$(git rev-list --count "HEAD..$UPSTREAM_SHA")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

          if git merge --no-ff --no-edit -m "merge: 自动合入 atmoomen/$UPSTREAM_BRANCH (${UPSTREAM_SHA::8})" "$UPSTREAM_SHA"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        id: push
        if: steps.merge.outputs.result == 'merged'
        run: |
          if git push origin "HEAD:$TARGET_BRANCH"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # 自动发版：CN 已包含上游最新, 而最近一次发布还没包含它 → 打下一个 v<上游版本>-mini.N。
      # 按「上游有没有发布过」判断而不是按「这次有没有合并」, 所以冲突被手工合并推上来之后,
      # 下一次定时运行也会补发。我们自己的功能改动不会触发发版（那个手动推 tag）。
      - name: Tag release
        id: tag
        if: steps.merge.outputs.result == 'up-to-date' || steps.push.outputs.pushed == 'true'
        run: |
          git fetch --tags --force origin
          last=$(git tag -l 'v*-mini.*' --sort=-v:refname | head -1)
          if [ -n "$last" ] && git merge-base --is-ancestor "$UPSTREAM_SHA" "$last"; then
            echo "上游 ${UPSTREAM_SHA::8} 已随 $last 发布过, 不发版"
            exit 0
          fi

          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' src/XIVLauncher/XIVLauncher.csproj | head -1)
          n=$(git tag -l "v$prefix-mini.*" | sed -E 's/.*-mini\.([0-9]+)$/\1/' | sort -n | tail -1)
          tag="v$prefix-mini.$(( ${n:-0} + 1 ))"

          git tag -a "$tag" -m "自动发版: 同步上游 ${UPSTREAM_SHA::8}" HEAD
          git push origin "$tag"
          echo "发版 $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Close resolved sync issue
        if: steps.merge.outputs.result == 'up-to-date' || steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label "$ISSUE_LABEL" --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "已与上游 \`${UPSTREAM_SHA::8}\` 同步，自动关闭。"
          done

      - name: Open / update sync issue
        if: steps.merge.outputs.result == 'conflict' || steps.push.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.merge.outputs.result }}
          BEHIND: ${{ steps.merge.outputs.behind }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          gh label create "$ISSUE_LABEL" --color FBCA04 --description "上游同步需要手工处理" 2>/dev/null || true

          if [ "$RESULT" = conflict ]; then
            reason="合并有冲突，冲突文件："
            files=$(printf '%s\n' "$CONFLICTS" | sed 's/^/- `/; s/$/`/')
          else
            reason="能干净合并，但推送被拒（多半是上游改了 \`.github/workflows/\`，GITHUB_TOKEN 无权推 workflow 文件）。"
            files=""
          fi

          body=$(cat <<EOF
          上游 \`AtmoOmen/FFXIVQuickLauncher@$UPSTREAM_BRANCH\` 领先 **$BEHIND** 个提交（最新 \`${UPSTREAM_SHA::8}\`）。

          $reason

          $files

          本地处理：

          \`\`\`bash
          git fetch atmoomen
          git checkout $TARGET_BRANCH
          git merge atmoomen/$UPSTREAM_BRANCH
          # 解完冲突后
          git push origin $TARGET_BRANCH
          \`\`\`

          推上去之后下一次定时任务会自动关掉这个 Issue。（运行记录：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）
          EOF
          )

          existing=$(gh issue list --label "$ISSUE_LABEL" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "上游同步需要手工处理（${UPSTREAM_SHA::8}）" --body "$body"
          else
            gh issue create --label "$ISSUE_LABEL" --title "上游同步需要手工处理（${UPSTREAM_SHA::8}）" --body "$body"
          fi

  release:
    needs: sync
    if: needs.sync.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.sync.outputs.tag }}
    permissions:
      contents: write
